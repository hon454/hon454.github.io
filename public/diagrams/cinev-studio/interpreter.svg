<svg xmlns="http://www.w3.org/2000/svg" width="440" height="572" viewBox="0 0 440 572" role="img" aria-labelledby="title desc">
<title id="title">AI 행동 지시의 해석과 실행</title>
<desc id="desc">외부 행동 지시: 파싱 · 행동과 대상 식별. 현재 장면의 문맥 구성: Actor · Component · 자세 · 점유 · 프레임. 실행 가능한 후보 선택: 액션별 요구조건 대조 → 후보 필터링, 시작 위치·경로 평가 → 점수와 탈락 사유. Executor: 선택한 액션 실행 · 시퀀스 생성</desc>
<style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#0f172a}.heading{font-size:23px;font-weight:700}.label{font-size:21px;font-weight:650}.body{font-size:18px;fill:#334155}</style>
<rect width="440" height="572" rx="12" fill="#fff"/>
<text x="28" y="42" class="heading">AI 행동 지시의 해석과 실행</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<g><rect x="24" y="72" width="392" height="90" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="42" y="105" class="label">외부 행동 지시</text>
<text x="42" y="135" class="body">파싱 · 행동과 대상 식별</text>
</g>
<path d="M220 165 V186" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g><rect x="24" y="192" width="392" height="90" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="42" y="225" class="label">현재 장면의 문맥 구성</text>
<text x="42" y="255" class="body">Actor · Component · 자세 · 점유 · 프레임</text>
</g>
<path d="M220 285 V306" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g><rect x="24" y="312" width="392" height="116" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="42" y="345" class="label">실행 가능한 후보 선택</text>
<text x="42" y="375" class="body">액션별 요구조건 대조 → 후보 필터링</text>
<text x="42" y="401" class="body">시작 위치·경로 평가 → 점수와 탈락 사유</text>
</g>
<path d="M220 431 V452" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g><rect x="24" y="458" width="392" height="90" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="42" y="491" class="label">Executor</text>
<text x="42" y="521" class="body">선택한 액션 실행 · 시퀀스 생성</text>
</g>
</svg>
