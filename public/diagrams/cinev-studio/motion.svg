<svg xmlns="http://www.w3.org/2000/svg" width="440" height="598" viewBox="0 0 440 598" role="img" aria-labelledby="title desc">
<title id="title">생성 모션을 편집으로 연결</title>
<desc id="desc">생성 요청과 비동기 결과 집계: HTTP / JSON · 성별과 배치 크기로 분할, 부분 실패 시에도 성공한 결과 보존. 성공 결과의 본 데이터 변환: 프로젝트 스켈레톤 · Root Motion 보정. 결과 목록에서 선택 · 편집 적용: 타임라인 적용 · Undo / Redo, MotionSet · 프로젝트 저장과 복원. 실패 결과는 별도로 기록: 성공 결과와 분리해 생성 상태 전달</desc>
<style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#0f172a}.heading{font-size:23px;font-weight:700}.label{font-size:21px;font-weight:650}.body{font-size:18px;fill:#334155}</style>
<rect width="440" height="598" rx="12" fill="#fff"/>
<text x="28" y="42" class="heading">생성 모션을 편집으로 연결</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<g><rect x="24" y="72" width="392" height="116" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="42" y="105" class="label">생성 요청과 비동기 결과 집계</text>
<text x="42" y="135" class="body">HTTP / JSON · 성별과 배치 크기로 분할</text>
<text x="42" y="161" class="body">부분 실패 시에도 성공한 결과 보존</text>
</g>
<path d="M220 191 V212" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g><rect x="24" y="218" width="392" height="90" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="42" y="251" class="label">성공 결과의 본 데이터 변환</text>
<text x="42" y="281" class="body">프로젝트 스켈레톤 · Root Motion 보정</text>
</g>
<path d="M220 311 V332" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g><rect x="24" y="338" width="392" height="116" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="42" y="371" class="label">결과 목록에서 선택 · 편집 적용</text>
<text x="42" y="401" class="body">타임라인 적용 · Undo / Redo</text>
<text x="42" y="427" class="body">MotionSet · 프로젝트 저장과 복원</text>
</g>
<g><rect x="24" y="484" width="392" height="90" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="42" y="517" class="label">실패 결과는 별도로 기록</text>
<text x="42" y="547" class="body">성공 결과와 분리해 생성 상태 전달</text>
</g>
</svg>
