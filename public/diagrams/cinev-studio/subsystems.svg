<svg xmlns="http://www.w3.org/2000/svg" width="440" height="650" viewBox="0 0 440 650" role="img" aria-labelledby="title desc">
<title id="title">메시지 전달과 구독 수명</title>
<desc id="desc">메시지 전달: 저장·로드·샷 이벤트 → 메시지 Subsystem, GameplayTag 채널 → 구독자 콜백, GameInstance 수명 · 구조체 payload 검사. UI Controller 초기화: 기존 구독 해제 → 새 구독 등록, 약한 참조 · 해제용 핸들 보관. UI Controller 종료: 핸들로 구독 해제, 서비스보다 먼저 종료되는 구독자 정리. 별도 토스트 서비스: GameInstance 수명 · 알림 요청 처리</desc>
<style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#0f172a}.heading{font-size:23px;font-weight:700}.label{font-size:21px;font-weight:650}.body{font-size:18px;fill:#334155}</style>
<rect width="440" height="650" rx="12" fill="#fff"/>
<text x="28" y="42" class="heading">메시지 전달과 구독 수명</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<g><rect x="24" y="72" width="392" height="142" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="42" y="105" class="label">메시지 전달</text>
<text x="42" y="135" class="body">저장·로드·샷 이벤트 → 메시지 Subsystem</text>
<text x="42" y="161" class="body">GameplayTag 채널 → 구독자 콜백</text>
<text x="42" y="187" class="body">GameInstance 수명 · 구조체 payload 검사</text>
</g>
<g><rect x="24" y="244" width="392" height="116" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="42" y="277" class="label">UI Controller 초기화</text>
<text x="42" y="307" class="body">기존 구독 해제 → 새 구독 등록</text>
<text x="42" y="333" class="body">약한 참조 · 해제용 핸들 보관</text>
</g>
<g><rect x="24" y="390" width="392" height="116" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="42" y="423" class="label">UI Controller 종료</text>
<text x="42" y="453" class="body">핸들로 구독 해제</text>
<text x="42" y="479" class="body">서비스보다 먼저 종료되는 구독자 정리</text>
</g>
<g><rect x="24" y="536" width="392" height="90" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="42" y="569" class="label">별도 토스트 서비스</text>
<text x="42" y="599" class="body">GameInstance 수명 · 알림 요청 처리</text>
</g>
</svg>
