<svg xmlns="http://www.w3.org/2000/svg" width="440" height="598" viewBox="0 0 440 598" role="img" aria-labelledby="title desc">
<title id="title">편집 상태에 맞춘 UI 구성</title>
<desc id="desc">이전 State 종료: Exit() · 기존 입력 전략 해제. 새 State 진입: Enter() · LayoutSpec / Registry, 화면 · 선택 모드 · 입력 전략 설정. 현재 상태에 맞게 조작: 일반 상태: 캐릭터 선택, 타깃 지정 상태: 상호작용 대상 선택. UI 공유 상태 전달: 자체 Blackboard · 변경 알림 → 화면 갱신</desc>
<style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#0f172a}.heading{font-size:23px;font-weight:700}.label{font-size:21px;font-weight:650}.body{font-size:18px;fill:#334155}</style>
<rect width="440" height="598" rx="12" fill="#fff"/>
<text x="28" y="42" class="heading">편집 상태에 맞춘 UI 구성</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<g><rect x="24" y="72" width="392" height="90" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="42" y="105" class="label">이전 State 종료</text>
<text x="42" y="135" class="body">Exit() · 기존 입력 전략 해제</text>
</g>
<path d="M220 165 V186" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g><rect x="24" y="192" width="392" height="116" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="42" y="225" class="label">새 State 진입</text>
<text x="42" y="255" class="body">Enter() · LayoutSpec / Registry</text>
<text x="42" y="281" class="body">화면 · 선택 모드 · 입력 전략 설정</text>
</g>
<path d="M220 311 V332" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g><rect x="24" y="338" width="392" height="116" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="42" y="371" class="label">현재 상태에 맞게 조작</text>
<text x="42" y="401" class="body">일반 상태: 캐릭터 선택</text>
<text x="42" y="427" class="body">타깃 지정 상태: 상호작용 대상 선택</text>
</g>
<g><rect x="24" y="484" width="392" height="90" rx="9" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
<text x="42" y="517" class="label">UI 공유 상태 전달</text>
<text x="42" y="547" class="body">자체 Blackboard · 변경 알림 → 화면 갱신</text>
</g>
</svg>
