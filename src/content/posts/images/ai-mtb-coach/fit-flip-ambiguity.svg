<svg viewBox="0 0 960 430" width="960" height="430" role="img" lang="ko" xmlns="http://www.w3.org/2000/svg">
<title>정사영에서 실루엣이 같은 두 자전거 자세</title>
<desc>좌우대칭 자전거 모델을 원근 없이 화면에 투영하면 yaw 30도, 왼쪽 기울기 25도인 자세와 yaw 150도, 오른쪽 기울기 25도인 자세의 실루엣이 같다. 앞의 자세는 앞바퀴가 카메라에서 먼 쪽에 있고 뒤의 자세는 앞바퀴가 카메라에 가까운 쪽에 있다. 실루엣은 bike_fit 모델로 계산했고 192px 렌더에서 두 자세의 차이 픽셀은 0개였다.</desc>
