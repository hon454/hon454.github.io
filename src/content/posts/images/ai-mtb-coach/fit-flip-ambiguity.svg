<text x="710" y="344" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0f172a">카메라 쪽으로 오는 자전거</text>
<text x="480" y="208" text-anchor="middle" font-size="22" font-weight="700" fill="#dc2626">=</text>
<text x="480" y="390" text-anchor="middle" font-size="12.5" fill="#475569">좌우대칭 모델은 깊이 방향으로 뒤집어도 실루엣이 같다. (yaw, lean)과 (180° − yaw, −lean)은 마스크만으로 구분할 수 없다.</text>
<text x="480" y="410" text-anchor="middle" font-size="12.5" fill="#475569">실루엣은 맞추기에 쓴 3D 자전거 모델로 계산했다. 192px 렌더에서 두 자세의 차이 픽셀은 0개다.</text>
