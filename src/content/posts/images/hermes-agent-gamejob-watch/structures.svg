<svg viewBox="0 0 960 330" width="960" height="330" role="img" lang="ko" xmlns="http://www.w3.org/2000/svg">
<title>실행 구조 비교: 에이전트가 실행하는 방식과 스크립트만 실행하는 방식</title>
<desc>고려한 두 구조를 비교한다. 에이전트 실행은 크론이 에이전트를 거쳐 수집과 판정을 맡기고, 선택한 no_agent 방식은 크론이 스크립트를 실행해 출력을 Slack으로 보낸다.</desc>
<defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/></pattern></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<rect width="100%" height="100%" fill="url(#g)"/>
<rect x="30" y="30" width="900" height="120" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
<text x="44" y="52" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">A / 에이전트가 실행 (고려한 구조)</text>
<rect x="60" y="62" width="180" height="66" rx="9" fill="#dcf6ec" stroke="#059669" stroke-width="1.6"/>
<text x="150.0" y="91.75" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">크론</text>
<text x="150.0" y="108.25" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#475569">매일 09:00</text>
<rect x="300" y="62" width="230" height="66" rx="9" fill="#fdecec" stroke="#dc2626" stroke-width="1.6"/>
<text x="415.0" y="91.75" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">에이전트 (LLM)</text>
<text x="415.0" y="108.25" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#475569">수집·비교·포맷을 지시받아 수행</text>
<rect x="590" y="62" width="150" height="66" rx="9" fill="#dcf6ec" stroke="#059669" stroke-width="1.6"/>
<text x="665.0" y="91.75" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Slack</text>
<text x="665.0" y="108.25" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#475569">#job-board</text>
<path d="M 240 95 L 300 95" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 530 95 L 590 95" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="770" y="90" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#b91c1c">실행마다</text>
<text x="770" y="108" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#b91c1c">모델 호출이 생긴다</text>
<rect x="30" y="175" width="900" height="130" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="5 4"/>
<text x="44" y="197" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">B / no_agent (선택한 구조)</text>
<rect x="60" y="212" width="180" height="66" rx="9" fill="#dcf6ec" stroke="#059669" stroke-width="1.6"/>
<text x="150.0" y="241.75" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">크론</text>
<text x="150.0" y="258.25" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#475569">no_agent: true</text>
<rect x="300" y="212" width="230" height="66" rx="9" fill="#dcf6ec" stroke="#059669" stroke-width="1.6"/>
<text x="415.0" y="241.75" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">스크립트</text>
<text x="415.0" y="258.25" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#475569">수집·판정·포맷을 코드로 고정</text>
<rect x="590" y="212" width="150" height="66" rx="9" fill="#dcf6ec" stroke="#059669" stroke-width="1.6"/>
<text x="665.0" y="241.75" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">Slack</text>
<text x="665.0" y="258.25" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#475569">#job-board</text>
<path d="M 240 245 L 300 245" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M 530 245 L 590 245" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ah)"/>
<text x="560" y="236" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" fill="#475569" stroke="#f8fafc" stroke-width="4" paint-order="stroke">stdout</text>
<text x="770" y="240" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#047857">실행당 LLM 호출 0회</text>
<text x="770" y="258" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="400" fill="#047857">(API calls: 0)</text>
</svg>
