<svg viewBox="0 0 960 470" width="960" height="470" role="img" lang="ko" xmlns="http://www.w3.org/2000/svg">
<title>본문에 들어간 사실과 출처</title>
<desc>CUH-7017B는 사용자가 직접 확인했다고 한 값, 펌웨어 8.50과 컨트롤러 잔기스는 사진, 1TB 단일 구성은 소니 공식 자료, 4K 업스케일링과 HDR은 공식 스펙이 출처다. 번개장터 예상 정산액 225,600원은 폼에서 읽기 전에 먼저 말했다가 정정했고, 이후 폼에서 같은 값을 확인했다.</desc>
<defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/></pattern></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<rect width="100%" height="100%" fill="url(#g)"/>
<text x="40" y="40" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">본문에 들어간 말</text>
<text x="560" y="40" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">출처</text>
<rect x="40" y="58" width="440" height="54" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="260.0" y="90.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">모델명 CUH-7017B</text>
<rect x="560" y="58" width="360" height="54" rx="9" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.6"/>
<text x="740.0" y="90.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">사용자 (직접 확인했다고 답함)</text>
<polyline points="484,85 556,85" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="40" y="130" width="440" height="54" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="260.0" y="162.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">시스템 소프트웨어 8.50</text>
<rect x="560" y="130" width="360" height="54" rx="9" fill="#e8f7ee" stroke="#16a34a" stroke-width="1.6"/>
<text x="740.0" y="162.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">사진 (시스템 정보 화면)</text>
<polyline points="484,157 556,157" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="40" y="202" width="440" height="54" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="260.0" y="234.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">컨트롤러 오른쪽 그립 잔기스</text>
<rect x="560" y="202" width="360" height="54" rx="9" fill="#e8f7ee" stroke="#16a34a" stroke-width="1.6"/>
<text x="740.0" y="234.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">사진 (본문의 "흠집 없음"과 어긋나 추가)</text>
<polyline points="484,229 556,229" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="40" y="274" width="440" height="54" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="260.0" y="306.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">1TB 단일 구성 · 4K 업스케일링 · HDR</text>
<rect x="560" y="274" width="360" height="54" rx="9" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.6"/>
<text x="740.0" y="306.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">소니 공식 자료 · 공식 스펙</text>
<polyline points="484,301 556,301" fill="none" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#ah)"/>
<rect x="40" y="346" width="440" height="54" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="260.0" y="378.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="13.5" font-weight="700" fill="#0f172a">번개장터 예상 정산액 225,600원</text>
<rect x="560" y="346" width="360" height="54" rx="9" fill="#fdecec" stroke="#dc2626" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="740.0" y="378.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a">읽기 전에 말해서 정정, 이후 폼에서 같은 값 확인</text>
<polyline points="484,373 556,373" fill="none" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<rect x="40" y="436" width="14" height="14" rx="3" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
<text x="61" y="447" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12" font-weight="400" fill="#475569">사용자</text>
<rect x="128" y="436" width="14" height="14" rx="3" fill="#e8f7ee" stroke="#16a34a" stroke-width="1.4"/>
<text x="149" y="447" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12" font-weight="400" fill="#475569">사진</text>
<rect x="203" y="436" width="14" height="14" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.4"/>
<text x="224" y="447" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12" font-weight="400" fill="#475569">공식 자료</text>
<rect x="317" y="436" width="14" height="14" rx="3" fill="#fdecec" stroke="#dc2626" stroke-width="1.4"/>
<text x="338" y="447" text-anchor="start" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12" font-weight="400" fill="#475569">읽기 전에 말함</text>
</svg>
