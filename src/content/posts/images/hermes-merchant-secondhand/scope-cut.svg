<svg viewBox="0 0 960 440" width="960" height="440" role="img" lang="ko" xmlns="http://www.w3.org/2000/svg">
<title>Merchant 범위를 줄인 결과</title>
<desc>처음 구상은 글 올리기, 올린 글 감시, 시세를 보고 가격 조정 제안, 판매 장부 저장과 git 백업, 원하는 물품 지속 검색이었다. 논의 끝에 작성·가격 제안·등록만 남기고 감시, 가격 조정 제안, 장부는 뺐다. 원하는 물품 검색은 나중에 구매 쪽 기능으로 따로 붙이기로 했다.</desc>
<defs><marker id="ah" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto"><polygon points="0 0,10 3.5,0 7" fill="#94a3b8"/></marker><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5"/></pattern></defs>
<rect width="100%" height="100%" fill="#f8fafc"/>
<rect width="100%" height="100%" fill="url(#g)"/>
<text x="30" y="36" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">처음 구상</text>
<text x="610" y="36" text-anchor="start" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace, Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b">남긴 것</text>
<rect x="30" y="56" width="340" height="56" rx="9" fill="#e8f7ee" stroke="#16a34a" stroke-width="1.6"/>
<text x="200.0" y="89.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">중고나라에 글 올리기</text>
<rect x="30" y="126" width="340" height="56" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="200.0" y="151.8" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">올린 글 감시</text>
<text x="200.0" y="168.8" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" fill="#475569">크론 · 로그인 만료 대응</text>
<rect x="30" y="196" width="340" height="56" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="200.0" y="229.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">시세 보고 가격 조정 제안</text>
<rect x="30" y="266" width="340" height="56" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="200.0" y="291.8" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">판매 장부 저장</text>
<text x="200.0" y="308.8" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" fill="#475569">캐시 · git 추적</text>
<rect x="30" y="336" width="340" height="56" rx="9" fill="#ffffff" stroke="#475569" stroke-width="1.6"/>
<text x="200.0" y="369.5" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">원하는 물품 지속 검색</text>
<rect x="610" y="56" width="320" height="56" rx="9" fill="#e8f7ee" stroke="#16a34a" stroke-width="1.6"/>
<text x="770.0" y="81.8" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">작성 · 가격 제안 · 등록</text>
<text x="770.0" y="98.8" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" fill="#475569">올린 뒤에는 추적하지 않는다</text>
<rect x="610" y="126" width="320" height="196" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="770.0" y="221.8" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">뺀 것</text>
<text x="770.0" y="238.8" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" fill="#475569">감시 · 가격 조정 제안 · 장부</text>
<rect x="610" y="336" width="320" height="56" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="1.6" stroke-dasharray="5 4"/>
<text x="770.0" y="361.8" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="14" font-weight="700" fill="#0f172a">나중에 구매 쪽 기능으로</text>
<text x="770.0" y="378.8" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11.5" fill="#475569">별도 스킬로 붙일 예정</text>
<polyline points="374,84.0 606,84.0" fill="none" stroke="#16a34a" stroke-width="1.8" marker-end="url(#ah)"/>
<polyline points="374,154.0 606,154.0" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="490" y="148.0" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">빼기</text>
<polyline points="374,224.0 606,224.0" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="490" y="218.0" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">빼기</text>
<polyline points="374,294.0 606,294.0" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
<text x="490" y="288.0" text-anchor="middle" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif" font-size="11" font-weight="400" fill="#94a3b8">빼기</text>
<polyline points="374,364.0 606,364.0" fill="none" stroke="#d97706" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#ah)"/>
</svg>
