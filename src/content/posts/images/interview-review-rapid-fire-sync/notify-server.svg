<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" role="img" lang="ko" aria-labelledby="t d">
<title id="t">쏘는 클라이언트가 서버에 알리는 세 가지 방식</title>
<desc id="d">60fps 클라이언트가 초당 70발로 쏠 때 0–100 ms 동안 서버로 가는 RPC를 세 방식으로 비교한다. 첫째, 발사마다 RPC를 보내면 1초에 70개이고 Reliable이면 손실이 길어지면 버퍼 한도에 닿는다. 둘째, 쏜 프레임마다 그 프레임의 발들을 RPC 하나로 묶어 첫 발사 시각, 발사 횟수, 조준 방향, 난수 시드를 보내면 1초에 60개 이하이며 서버는 발사 간격으로 각 발의 시각을 복원해 검사한다. 셋째, 사격 시작과 정지만 보내면 사격 한 번에 2개이고 서버가 같은 누적 시간 루프로 직접 쏜다. 그림 구간은 연사 중이라 시작만 보이고, 정지는 버튼을 뗄 때 구간 뒤에 간다. 조준 방향은 이동 RPC와 함께 오는 시야각을 쓴다. 네트워크 지연은 그림에서 뺐다.</desc>
