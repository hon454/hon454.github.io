<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" lang="ko" aria-labelledby="t d">
<title id="t">서버가 묶은 발사 RPC를 다음 발사 허용 시각으로 거르기</title>
<desc id="d">조작된 클라이언트가 첫 발사 시각과 발사 횟수 10을 보냈다. 서버는 첫 발사 시각에 발사 간격 14.3 ms를 더해 발사 열 번의 시각을 복원한다. 다음 발사 허용 시각보다 이른 두 발은 연사보다 빠르므로 거르고, 서버 현재 시각보다 미래인 발사도 거른다. 그 사이의 발사는 따라잡기 상한 4발까지만 받아들이고, 받아들일 때마다 허용 시각을 발사 간격만큼 미룬다. 비교에는 허용 오차 4 ms를 둔다.</desc>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#e8edf3" stroke-width="1"/></pattern>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#94a3b8"/></marker>

<style>
text{font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;fill:#1f2937}
.title{font-size:24px;font-weight:700}
.sub{font-size:15px;fill:#64748b}
.lane{font-size:16px;font-weight:700}
.lanesub{font-size:13px;fill:#64748b}
.mono{font-family:'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,monospace}
.tick{font-size:12px;fill:#94a3b8;text-anchor:middle}
.cnt{font-size:13px;font-weight:700;text-anchor:middle}
.note{font-size:13px;fill:#64748b}
.big{font-size:28px;font-weight:800;text-anchor:middle}
.cap{font-size:14px;font-weight:700;fill:#334155}
</style>
</defs>
<rect width="1000" height="520" fill="#f8fafc"/>
<rect width="1000" height="520" fill="url(#grid)"/>

<text x="40" y="50" class="title">서버는 복원한 발사 시각을 하나씩 거른다</text>
<text x="40" y="78" class="sub">조작된 RPC: 첫 발사 시각 t₀, 10발 · 발사 간격 14.3 ms · 허용 오차 ±4 ms · 따라잡기 상한 4발</text>
<text x="40" y="145" class="lane" style="fill:#4f46e5">클라이언트가 보낸 것</text>
<text x="40" y="165" class="lanesub">RPC 하나: t₀, 발사 횟수 10 → 서버가 t₀ + i × 14.3 ms로 복원</text>
<line x1="90" y1="205" x2="930" y2="205" stroke="#cbd5e1" stroke-width="2"/>
<text x="40" y="285" class="lane" style="fill:#16a34a">서버 판정</text>
<text x="40" y="305" class="lanesub">다음 발사 허용 시각과 서버 현재 시각으로 비교</text>
<line x1="90" y1="345" x2="930" y2="345" stroke="#cbd5e1" stroke-width="2"/>
<line x1="310.48059149722735" y1="181" x2="310.48059149722735" y2="385" stroke="#16a34a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="310.48059149722735" y="403" class="cnt" style="fill:#16a34a">다음 발사 허용 시각</text>
<rect x="693.2" y="181" width="43.5" height="204" fill="#b91c1c" opacity=".08"/>
<line x1="714.9537892791127" y1="181" x2="714.9537892791127" y2="385" stroke="#b91c1c" stroke-width="2" stroke-dasharray="5 4"/>
<text x="714.9537892791127" y="403" class="cnt" style="fill:#b91c1c">서버 현재 시각</text>
<circle cx="155.2" cy="205" r="8" fill="#4f46e5"/>
<text x="155.2" y="231" class="tick">1</text>
<circle cx="155.2" cy="345" r="9" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
<text x="155.2" y="349" class="cnt" style="fill:#b91c1c;font-size:11px">✕</text>
<line x1="155.2" y1="239" x2="155.2" y2="331" stroke="#cbd5e1" stroke-dasharray="2 3"/>
<circle cx="232.8" cy="205" r="8" fill="#4f46e5"/>
<text x="232.8" y="231" class="tick">2</text>
<circle cx="232.8" cy="345" r="9" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
<text x="232.8" y="349" class="cnt" style="fill:#b91c1c;font-size:11px">✕</text>
<line x1="232.8" y1="239" x2="232.8" y2="331" stroke="#cbd5e1" stroke-dasharray="2 3"/>
<circle cx="310.5" cy="205" r="8" fill="#4f46e5"/>
<text x="310.5" y="231" class="tick">3</text>
<circle cx="310.5" cy="345" r="9" fill="#16a34a"/>
<text x="310.5" y="349" class="cnt" style="fill:#fff;font-size:11px">✓</text>
<line x1="310.5" y1="239" x2="310.5" y2="331" stroke="#cbd5e1" stroke-dasharray="2 3"/>
<circle cx="388.1" cy="205" r="8" fill="#4f46e5"/>
<text x="388.1" y="231" class="tick">4</text>
<circle cx="388.1" cy="345" r="9" fill="#16a34a"/>
<text x="388.1" y="349" class="cnt" style="fill:#fff;font-size:11px">✓</text>
<line x1="388.1" y1="239" x2="388.1" y2="331" stroke="#cbd5e1" stroke-dasharray="2 3"/>
<circle cx="465.7" cy="205" r="8" fill="#4f46e5"/>
<text x="465.7" y="231" class="tick">5</text>
<circle cx="465.7" cy="345" r="9" fill="#16a34a"/>
<text x="465.7" y="349" class="cnt" style="fill:#fff;font-size:11px">✓</text>
<line x1="465.7" y1="239" x2="465.7" y2="331" stroke="#cbd5e1" stroke-dasharray="2 3"/>
<circle cx="543.4" cy="205" r="8" fill="#4f46e5"/>
<text x="543.4" y="231" class="tick">6</text>
<circle cx="543.4" cy="345" r="9" fill="#16a34a"/>
<text x="543.4" y="349" class="cnt" style="fill:#fff;font-size:11px">✓</text>
<line x1="543.4" y1="239" x2="543.4" y2="331" stroke="#cbd5e1" stroke-dasharray="2 3"/>
<circle cx="621.0" cy="205" r="8" fill="#4f46e5"/>
<text x="621.0" y="231" class="tick">7</text>
<circle cx="621.0" cy="345" r="9" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
<text x="621.0" y="349" class="cnt" style="fill:#b91c1c;font-size:11px">✕</text>
<line x1="621.0" y1="239" x2="621.0" y2="331" stroke="#cbd5e1" stroke-dasharray="2 3"/>
<circle cx="698.7" cy="205" r="8" fill="#4f46e5"/>
<text x="698.7" y="231" class="tick">8</text>
<circle cx="698.7" cy="345" r="9" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
<text x="698.7" y="349" class="cnt" style="fill:#b91c1c;font-size:11px">✕</text>
<line x1="698.7" y1="239" x2="698.7" y2="331" stroke="#cbd5e1" stroke-dasharray="2 3"/>
<circle cx="776.3" cy="205" r="8" fill="#4f46e5"/>
<text x="776.3" y="231" class="tick">9</text>
<circle cx="776.3" cy="345" r="9" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
<text x="776.3" y="349" class="cnt" style="fill:#b91c1c;font-size:11px">✕</text>
<line x1="776.3" y1="239" x2="776.3" y2="331" stroke="#cbd5e1" stroke-dasharray="2 3"/>
<circle cx="853.9" cy="205" r="8" fill="#4f46e5"/>
<text x="853.9" y="231" class="tick">10</text>
<circle cx="853.9" cy="345" r="9" fill="#fff" stroke="#b91c1c" stroke-width="2"/>
<text x="853.9" y="349" class="cnt" style="fill:#b91c1c;font-size:11px">✕</text>
<line x1="853.9" y1="239" x2="853.9" y2="331" stroke="#cbd5e1" stroke-dasharray="2 3"/>
<text x="194.0" y="325" class="cnt" style="fill:#b91c1c;font-size:12px">연사보다 빠름</text>
<text x="426.9" y="325" class="cnt" style="fill:#16a34a;font-size:12px">받아들임 (4발)</text>
<text x="659.8" y="325" class="cnt" style="fill:#b91c1c;font-size:12px">상한 초과</text>
<text x="815.1" y="325" class="cnt" style="fill:#b91c1c;font-size:12px">미래 시각</text>
<text x="40" y="470" class="note">받아들인 발사마다 다음 발사 허용 시각을 14.3 ms씩 미룬다. 탄약이 모자라면 남은 탄약 수로 한 번 더 자른다.</text>
<text x="40" y="492" class="note">허용 오차가 없으면 시각을 압축하거나 반올림한 정상 클라이언트의 발사도 걸러진다.</text>
</svg>
