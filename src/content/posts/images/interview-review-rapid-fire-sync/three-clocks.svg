.title{font-size:24px;font-weight:700}
.sub{font-size:15px;fill:#64748b}
.lane{font-size:16px;font-weight:700}
.lanesub{font-size:13px;fill:#64748b}
.mono{font-family:'JetBrains Mono',Consolas,'SFMono-Regular',Menlo,monospace}
.tick{font-size:12px;fill:#94a3b8;text-anchor:middle}
.cnt{font-size:13px;font-weight:700;text-anchor:middle}
.note{font-size:13px;fill:#64748b}
.big{font-size:28px;font-weight:800;text-anchor:middle}
.cap{font-size:14px;font-weight:700;fill:#334155}
</style>
</defs>
<rect width="1000" height="600" fill="#f8fafc"/>
