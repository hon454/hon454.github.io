<svg xmlns="http://www.w3.org/2000/svg" width="440" height="478" viewBox="0 0 440 478" role="img" aria-labelledby="title desc">
<title id="title">액션 데이터 작성과 실행</title>
<desc id="desc">작성 목적에 맞춘 입력: 대상 조건: DataAsset · Instanced Struct, 구간·이벤트: AnimComposite · Modifier, 목록·일괄 편집: DataTable. Generated Data Asset: 조건·구간·이벤트 정보를 생성 단계에서 통합. 액션 런타임: 생성 데이터를 읽어 액션 실행</desc>
<style>text{font-family:"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#0f172a}.heading{font-size:23px;font-weight:700}.label{font-size:21px;font-weight:650}.body{font-size:18px;fill:#334155}</style>
<rect width="440" height="478" rx="12" fill="#fff"/>
<text x="28" y="42" class="heading">액션 데이터 작성과 실행</text>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker></defs>
<g><rect x="24" y="72" width="392" height="142" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<text x="42" y="105" class="label">작성 목적에 맞춘 입력</text>
<text x="42" y="135" class="body">대상 조건: DataAsset · Instanced Struct</text>
<text x="42" y="161" class="body">구간·이벤트: AnimComposite · Modifier</text>
<text x="42" y="187" class="body">목록·일괄 편집: DataTable</text>
</g>
<path d="M220 217 V238" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g><rect x="24" y="244" width="392" height="90" rx="9" fill="#ecfdf5" stroke="#059669" stroke-width="1.5"/>
<text x="42" y="277" class="label">Generated Data Asset</text>
<text x="42" y="307" class="body">조건·구간·이벤트 정보를 생성 단계에서 통합</text>
</g>
<path d="M220 337 V358" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<g><rect x="24" y="364" width="392" height="90" rx="9" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="42" y="397" class="label">액션 런타임</text>
<text x="42" y="427" class="body">생성 데이터를 읽어 액션 실행</text>
